name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eva
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: eva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eva -d eva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r backend/api/requirements.txt
      - name: Run tests
        env:
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_USER: eva
          TEST_PG_PASSWORD: changeme
          TEST_APP_DB_PASSWORD: appsecret
        run: python -m pytest
