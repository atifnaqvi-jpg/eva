name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eva
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: eva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eva -d eva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/api/widget/package-lock.json

      # The widget is a build artefact, not source: the Python suite asserts the
      # *shipped* bundle (size, wiring, and SEC-08's storage audit), so it must be
      # built before pytest runs.
      - name: Build widget
        working-directory: backend/api/widget
        run: |
          npm ci
          node build.mjs
          node --test test/*.test.mjs

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r backend/api/requirements.txt

      # The dashboard's client tests need no services and no browser: they run on Node's
      # built-in test runner against a stubbed fetch. Kept before pytest so a broken API
      # client is reported as itself rather than as a downstream screen failure.
      - name: Dashboard client tests
        working-directory: dashboard
        run: npm test
      - name: Run tests
        env:
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_USER: eva
          TEST_PG_PASSWORD: changeme
          TEST_APP_DB_PASSWORD: appsecret
        run: python -m pytest --ignore=tests/test_eval_gate.py

      # 21.3 lists the eval gate as its own stage, and G6 makes a metric drop
      # blocking. Running it separately keeps a quality regression distinguishable
      # from a unit-test failure in the run summary.
      - name: Eval gate
        env:
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_USER: eva
          TEST_PG_PASSWORD: changeme
          TEST_APP_DB_PASSWORD: appsecret
        run: python -m pytest tests/test_eval_gate.py -v

  # The widget's real-browser matrix (WIDG-10/11/16, SEC-08). Separate job because it
  # needs browsers and a running stack, and because a flaky browser run should not
  # mask a unit-test result in the summary (§21.3).
  widget-browser:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eva
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: eva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eva -d eva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/api/widget/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r backend/api/requirements.txt
      - name: Build widget
        working-directory: backend/api/widget
        run: |
          npm ci
          node build.mjs
      - name: Install browsers
        working-directory: backend/api/widget
        # Chromium is the default engine; Firefox and WebKit run the same matrix so a
        # key event or layout path that only one engine implements is caught here
        # rather than by a customer. Edge is Chromium and is not installed separately.
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start the API
        env:
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_USER: eva
          TEST_PG_PASSWORD: changeme
          TEST_APP_DB_PASSWORD: appsecret
        run: |
          # The browser matrix needs the real serving path (static assets, the demo
          # page, the session origin check), so it runs against a live uvicorn rather
          # than the ASGI test client.
          python -m pytest tests/test_widget_serving.py -q
      - name: Browser matrix
        working-directory: backend/api/widget
        env:
          WIDGET_BASE_URL: http://localhost:8000
          WIDGET_BOT_ID: ${{ vars.WIDGET_BOT_ID }}
        run: |
          for engine in chromium firefox webkit; do
            echo "::group::$engine"
            WIDGET_BROWSER=$engine node --test test/browser.test.mjs
            echo "::endgroup::"
          done
