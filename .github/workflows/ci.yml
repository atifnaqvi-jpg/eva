name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eva
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: eva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eva -d eva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/api/widget/package-lock.json

      # The widget is a build artefact, not source: the Python suite asserts the
      # *shipped* bundle (size, wiring, and SEC-08's storage audit), so it must be
      # built before pytest runs.
      - name: Build widget
        working-directory: backend/api/widget
        run: |
          npm ci
          node build.mjs
          node --test test/*.test.mjs

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r backend/api/requirements.txt

      # The dashboard's client tests need no services and no browser: they run on Node's
      # built-in test runner against a stubbed fetch. Kept before pytest so a broken API
      # client is reported as itself rather than as a downstream screen failure.
      - name: Dashboard client tests
        working-directory: dashboard
        run: npm test
      - name: Run tests
        env:
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_USER: eva
          TEST_PG_PASSWORD: changeme
          TEST_APP_DB_PASSWORD: appsecret
        run: python -m pytest --ignore=tests/test_eval_gate.py

      # 21.3 lists the eval gate as its own stage, and G6 makes a metric drop
      # blocking. Running it separately keeps a quality regression distinguishable
      # from a unit-test failure in the run summary.
      - name: Eval gate
        env:
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_USER: eva
          TEST_PG_PASSWORD: changeme
          TEST_APP_DB_PASSWORD: appsecret
        run: python -m pytest tests/test_eval_gate.py -v

  # §19.1 asks for dependency scanning and SAST *in CI*. A separate job, on purpose:
  # it is the one stage that can fail for a reason outside this repository (a new
  # advisory, or OSV unreachable), and a security failure must not be reported as a
  # unit-test failure. It is not `continue-on-error`: a gate that cannot block is
  # documentation (§21.3).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The scanner resolves each requirements file with pip and audits both
      # JavaScript trees from their lockfiles, so it needs pip and npm but *not* the
      # project's own install: no service containers, and a scan that never imports
      # app code cannot be confused by a broken import.
      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Dependency scan + SAST
        # `--github` turns each failure into an `::error::` annotation. Job logs need
        # admin rights on this repository, so the annotation is the readable channel
        # (the same reason the browser matrix annotates its failures).
        run: python scripts/security_scan.py --github

  # The widget's real-browser matrix (WIDG-10/11/16, SEC-08). Separate job because it
  # needs browsers and a running stack, and because a flaky browser run should not
  # mask a unit-test result in the summary (§21.3).
  widget-browser:
    # Pinned, not `ubuntu-latest`. Playwright's `install --with-deps` ships a
    # hard-coded apt package list for the OS it was built against, and the names do
    # not survive a distro bump: on the Ubuntu 26 runner, `libicu74`, `libx264-164`,
    # `libvpx9` and `libxml2` have no installation candidate, so WebKit (the largest
    # dependency list of the three engines) fails to install while Chromium and
    # Firefox still pass. `ubuntu-latest` began moving to 26 on 2026-10-19, which is
    # exactly when this job went red. Pinning to 24.04 matches the Playwright build
    # and makes this a deliberate upgrade step rather than a silent breakage.
    runs-on: ubuntu-24.04
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eva
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: eva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eva -d eva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/api/widget/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r backend/api/requirements.txt
      - name: Build widget
        working-directory: backend/api/widget
        run: |
          npm ci
          node build.mjs
      - name: Install browsers
        working-directory: backend/api/widget
        # Chromium is the default engine; Firefox and WebKit run the same matrix so a
        # key event or layout path that only one engine implements is caught here
        # rather than by a customer. Edge is Chromium and is not installed separately.
        #
        # Installed one engine at a time, on purpose: a single command that names three
        # engines reports only "exit code 1", which is not enough to tell a missing
        # system library from a failed download from a full disk. The loop makes the
        # failing step say which engine died and prints the state that explains it.
        run: |
          set -x
          node --version
          npx playwright --version
          df -h /
          for engine in chromium firefox webkit; do
            echo "::group::install $engine"
            # Three attempts: each engine is a ~100 MB download and a reset mid-transfer
            # is the ordinary failure mode, not a code defect. Without a retry, one bad
            # minute of CDN weather turns the only real-browser signal in CI red and the
            # next reader learns to ignore it (§21.3).
            for attempt in 1 2 3; do
              npx playwright install --with-deps "$engine" 2>&1 | tee "/tmp/pw-$engine.log"
              rc=${PIPESTATUS[0]}
              [ "$rc" -eq 0 ] && break
              echo "::warning::$engine install attempt $attempt failed (exit $rc)"
              sleep $((attempt * 10))
            done
            echo "::endgroup::"
            if [ "${rc:-1}" -ne 0 ]; then
              echo "::error::playwright install failed for $engine after 3 attempts (exit $rc)"
              df -h /
              # Surface the underlying cause as an annotation. Job logs need admin rights
              # to download, but annotations are readable, so this is the channel that
              # makes the failure diagnosable at all.
              grep -iE "unable to locate|has no installation candidate|E: |error:|not found" \
                "/tmp/pw-$engine.log" | tail -8 | while IFS= read -r line; do
                  echo "::error::$engine: $line"
                done
              exit "$rc"
            fi
          done
      - name: Migrate the stack database
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql+psycopg://eva:changeme@127.0.0.1:5432/eva
          EVA_APP_DB_PASSWORD: appsecret
        run: python -m alembic upgrade head
      - name: Browser matrix
        # One step, deliberately. The runner kills any process a step leaves behind
        # when that step ends, so a uvicorn started in an earlier step is dead by the
        # time the matrix runs -- and the matrix would then fail on a connection
        # refused that looks like a widget bug. Server, seed, matrix and the
        # non-vacuity check therefore share one shell, with the server killed on exit.
        working-directory: backend/api/widget
        env:
          WIDGET_BASE_URL: http://127.0.0.1:8000
          APP_DATABASE_URL: postgresql+psycopg://eva_app:appsecret@127.0.0.1:5432/eva
          SESSION_COOKIE_SECURE: "false"
          WIDGET_TOKEN_SECRET: ci-widget-token-secret-0123456789abcdef
          WIDGET_ASSET_DIR: ${{ github.workspace }}/backend/api/widget/dist
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_USER: eva
          TEST_PG_PASSWORD: changeme
          EVA_DB: eva
        run: |
          set -u
          # A live uvicorn, not the ASGI test client: the matrix checks static assets,
          # the demo page and the session origin check, which only exist over a socket.
          # `app.main:app` resolves relative to `backend/api`, exactly as the Dockerfile
          # runs it.
          # `exec` matters: without it the background job is the subshell, `$!` is the
          # subshell's pid, and killing it orphans uvicorn (reparented to init) so the
          # server outlives the trap. With `exec` the subshell becomes uvicorn and the
          # trap kills the server itself.
          ( cd "$GITHUB_WORKSPACE/backend/api" && exec python -m uvicorn app.main:app \
              --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 ) &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "$WIDGET_BASE_URL/widget/loader.js" && break
            sleep 1
          done
          curl -sf -o /dev/null "$WIDGET_BASE_URL/widget/loader.js" || {
            echo "::error::the API never became ready"; tail -40 /tmp/uvicorn.log; exit 1; }

          # A deterministic bot with a verified origin. Without one the matrix has no
          # session to open -- which is how this job used to pass while running nothing,
          # reading an unset `vars.WIDGET_BOT_ID` and skipping all nine cases.
          # stderr to a file, not merged: the seeder warns about the absent embedder on
          # stderr, and folding that into stdout would make the captured "bot id" a
          # warning message plus an id.
          bot_id=$(python "$GITHUB_WORKSPACE/scripts/seed_widget_bot.py" \
            --base "$WIDGET_BASE_URL" --origin "$WIDGET_BASE_URL" 2>/tmp/seed.err) || {
            # Job logs need admin rights to read, so a bare exit code is the only signal
            # this step would otherwise give. Annotations are readable: surface the
            # seeder's own words here or the failure is undiagnosable from outside.
            echo "::error::the seeder failed: $(tail -5 /tmp/seed.err | tr '\n' ' ')"
            exit 1; }
          echo "seeded bot: $bot_id"
          export WIDGET_BOT_ID="$bot_id"

          failed=0
          for engine in chromium firefox webkit; do
            echo "::group::$engine"
            WIDGET_BROWSER=$engine node --test test/browser.test.mjs \
              2>&1 | tee "/tmp/matrix-$engine.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              failed=1
              # Annotations are the only readable channel here (job logs need admin), so
              # put the failing case names in one rather than leaving "exit code 1".
              failing=$(grep -E "^✖|not ok |AssertionError|Error:" "/tmp/matrix-$engine.log" \
                | head -8 | tr '\n' ' ' | cut -c1-900)
              echo "::error::$engine failed (exit $rc): ${failing:-see log}"
            fi
            echo "::endgroup::"
          done

          # The assertion whose absence made the old green meaningless: `node --test`
          # counts a skip as a success, so a run that tested nothing still exited 0.
          output=$(WIDGET_BROWSER=chromium node --test test/browser.test.mjs 2>&1)
          echo "$output" | tail -12
          skipped=$(printf '%s' "$output" | sed -n 's/^ℹ skipped \([0-9]*\)$/\1/p')
          passed=$(printf '%s' "$output" | sed -n 's/^ℹ pass \([0-9]*\)$/\1/p')
          if [ "${skipped:-x}" != "0" ]; then
            echo "::error::the matrix skipped ${skipped:-an unknown number of} cases; it is not testing the product"
            exit 1
          fi
          # 11 as of WIDG-17, which added the two cases that pin the Escape race; a
          # floor, so a later addition does not have to edit this number.
          if [ "${passed:-0}" -lt 11 ]; then
            echo "::error::expected at least 11 browser cases to pass, saw ${passed:-0}"
            exit 1
          fi
          exit $failed
