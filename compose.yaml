name: eva

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eva}
      POSTGRES_DB: ${POSTGRES_DB:-eva}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eva} -d ${POSTGRES_DB:-eva}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend/api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_DATABASE_URL: postgresql+psycopg://eva_app:${EVA_APP_DB_PASSWORD:?EVA_APP_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-eva}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eva}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-eva}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  embed:
    build: ./backend/embed
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # BGE-M3 measured 2.3-3.2 GiB resident (PLAN 8.2).
          memory: 5g
    environment:
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      EMBEDDING_MODEL_KEY: bge-m3
    volumes:
      - hf_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # BGE-M3 measures ~3.2 GiB resident on CPU (measured 2026-11-16:
          # 33 s load, 2.2 chunks/s). 512 MiB OOM-killed it, so the worker gets
          # its own larger budget instead of sharing the api's.
          memory: 5g
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_DATABASE_URL: postgresql+psycopg://eva_app:${EVA_APP_DB_PASSWORD:-changeme}@postgres:5432/eva
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_DIM: "1024"
      EMBEDDING_QUERY_URL: http://embed:8080
    volumes:
      # Model weights persist across restarts; re-downloading them costs ~2.3 GB.
      - hf_cache:/models
    depends_on:
      redis:
        condition: service_healthy
      embed:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "worker.settings.WorkerSettings", "--check"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set for production (e.g. app.example.com) to enable automatic HTTPS.
      # Caddy's {$VAR:default} only falls back when the variable is unset, so the
      # default has to be applied here; an empty value would blank the site address.
      EVA_DOMAIN: ${EVA_DOMAIN:-http://localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hf_cache:
  pgdata:
  caddy_data:
  caddy_config:
