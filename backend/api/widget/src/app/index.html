<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <!-- The widget frame is embedded by third-party pages. `frame-ancestors` is
         intentionally not set to 'none' — the domain check on the API, not the
         header, decides which pages may serve it. -->
    <meta name="referrer" content="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/widget/app.js" defer></script>
  </body>
</html>
